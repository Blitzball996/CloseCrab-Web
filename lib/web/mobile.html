<!doctype html>
<html lang="zh-CN" data-theme="paper">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f7f9fa"><title>CloseCrab · Chat</title>
 <link rel="icon" href="/logo.png"><link rel="stylesheet" href="/mobile.css">
 <script defer src="/vendor/lucide.js"></script><script defer src="/vendor/marked.js"></script><script defer src="/vendor/purify.js"></script><script defer src="/mobile.js"></script>
</head>
<body>
 <div class="shell">
  <header class="topbar">
   <button id="sessions-button" class="icon-button" aria-label="会话列表"><i data-lucide="panel-left"></i></button>
   <img src="/logo.png" class="brand-image" alt=""><div class="brand"><strong>CloseCrab</strong><span id="connection" role="status">连接中</span></div>
   <div class="header-actions"><select id="language" aria-label="Language"><option value="zh-CN">中文</option><option value="en">EN</option></select><button id="theme" class="icon-button" aria-label="切换主题"><i data-lucide="sun-moon"></i></button></div>
  </header>
  <section class="conversation-bar"><div><h1 id="conversation-title">新会话</h1><p id="model"></p></div><button id="new-session" class="icon-button" aria-label="新建会话"><i data-lucide="square-pen"></i></button></section>
  <div id="notice" role="alert" hidden></div>
  <main id="timeline" aria-label="对话内容"><div id="messages"></div><div id="activity" role="status" hidden><span class="pulse"></span><span data-i18n="working">正在处理</span></div></main>
  <button id="jump" class="jump" hidden><i data-lucide="arrow-down"></i><span data-i18n="latest">回到最新</span></button>
  <section id="approval" hidden aria-label="等待确认"></section>
  <footer class="composer-area"><form id="composer"><textarea id="draft" rows="1" placeholder="发消息，接着聊…" aria-label="消息"></textarea><button id="voice" type="button" class="icon-button voice" aria-label="语音输入"><i data-lucide="mic"></i></button><button id="send" type="submit" class="send" aria-label="发送" disabled><i data-lucide="arrow-up"></i></button><button id="stop" type="button" class="send stop" aria-label="停止生成" hidden><i data-lucide="square"></i></button></form><div class="composer-meta"><span id="composer-status"></span><span data-i18n="synced">与桌面共享</span></div></footer>
 </div>
 <dialog id="sessions-dialog"><header><h2 data-i18n="sessions">会话</h2><button id="close-sessions" class="icon-button" aria-label="关闭"><i data-lucide="x"></i></button></header><button id="drawer-new" class="new-button"><i data-lucide="plus"></i><span data-i18n="new">新建会话</span></button><div id="session-list"></div></dialog>
 <dialog id="login-dialog"><form id="login"><img src="/logo.png" width="40" height="40" alt=""><h2 data-i18n="connect">连接你的工作室</h2><label for="token" data-i18n="token">访问令牌</label><input id="token" type="password" autocomplete="off" required><p id="login-error" role="alert"></p><button type="submit" class="new-button" data-i18n="connectAction">连接</button></form></dialog>
</body></html>
